services:
  timelapse:
    build: .
    container_name: timelapse-cam
    ports:
      - "5000:5000"
    volumes:
      # rclone config with the Box token (rclone refreshes it, so it must be writable)
      - ${RCLONE_CONFIG_DIR:-~/.config/rclone}:/config/rclone
      - ./data:/app/data
    tmpfs:
      # Last 48h of frames live in RAM (uploaded to Box in batches); nothing is written to the disk
      - /app/spool:size=3g,uid=1000,gid=1000
      - /app/work:size=8g,uid=1000,gid=1000
    env_file: .env
    environment:
      - BOX_REMOTE=box:MaryJaneTimeLapse
      - TIMELAPSE_FRAME_DURATION=0.1
      - TIMELAPSE_LOOK=plantas      # plantas | natural | cinematic | cinemascope
      - UPLOAD_INTERVAL=600         # seconds between batch uploads to Box
      - LOCAL_RETENTION_HOURS=48    # frames kept in RAM for quick timelapses
    stop_grace_period: 2m
    restart: unless-stopped
